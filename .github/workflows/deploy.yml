# 1. Trigger on every push or merge to develop
on:
  push:
    branches:
      - develop

jobs:
  # 2. Build & push Docker image
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}    # :contentReference[oaicite:0]{index=0}

      - name: Build & push image
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/app-backend:develop
          platforms: linux/amd64                       # ensure correct arch :contentReference[oaicite:1]{index=1}

  # 3. SSH into Oracle and deploy
  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Set up SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.ORACLE_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H "${{ secrets.ORACLE_HOST }}" >> ~/.ssh/known_hosts
        env:
          ORACLE_SSH_KEY: ${{ secrets.ORACLE_SSH_KEY }}
          ORACLE_HOST:   ${{ secrets.ORACLE_HOST }}   # :contentReference[oaicite:2]{index=2}

      - name: Deploy to Oracle VM
        run: |
          ssh ${{ secrets.ORACLE_USER }}@${{ secrets.ORACLE_HOST }} << 'EOF'
            cd ~/app-personal-finance-backend
            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/app-backend:develop
            docker-compose up -d --no-deps backend
          EOF
        env:
          ORACLE_USER:         ${{ secrets.ORACLE_USER }}
          ORACLE_HOST:         ${{ secrets.ORACLE_HOST }}
          DOCKERHUB_USERNAME:  ${{ secrets.DOCKERHUB_USERNAME }}

      - name: Verify logs
        run: |
          ssh ${{ secrets.ORACLE_USER }}@${{ secrets.ORACLE_HOST }} \
            "docker logs -f \$(docker-compose ps -q backend)"
        env:
          ORACLE_USER: ${{ secrets.ORACLE_USER }}
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}